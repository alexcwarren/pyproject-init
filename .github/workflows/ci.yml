name: CI

on:
  push:
    branches:
      - main
      - "release/**"

  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Synchronize environment
        run: uv sync --locked

      - name: Run routine verification
        run: uv run python scripts/verify.py

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run tests on Python ${{ matrix.python-version }}
        run: uv run --locked --python ${{ matrix.python-version }} pytest

  generated-project:
    name: Generated project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Synchronize environment
        run: uv sync --locked

      - name: Smoke-test generated project
        run: uv run python scripts/smoke_generated_project.py

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Synchronize environment
        run: uv sync --locked

      - name: Smoke-test built package
        run: uv run python scripts/smoke_package.py

  ci-success:
    name: CI
    if: always()
    needs:
      - quality
      - compatibility
      - generated-project
      - package
    runs-on: ubuntu-latest

    steps:
      - name: Confirm all CI jobs passed
        if: >-
          needs.quality.result != 'success' ||
          needs.compatibility.result != 'success' ||
          needs.generated-project.result != 'success' ||
          needs.package.result != 'success'
        run: exit 1

      - name: CI passed
        run: echo "All CI jobs passed."
